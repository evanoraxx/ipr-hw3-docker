services:
  app:
    build: .
    image: ipr-hw3-app:latest
    ports:
      - "${HOST_PORT:-8080}:8000"
    environment:
      PORT: "8000"
      GREETING: "${GREETING:-Hello, Docker!}"
      STORAGE: sqlite
      DATA_FILE: /data/counter.db
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
